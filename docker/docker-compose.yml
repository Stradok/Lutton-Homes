x-wp-db-env: &wp-db-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env}

services:
  db:
    image: mariadb:11.8.9
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    depends_on:
      - db
    environment: *wp-db-env
    ports:
      - "127.0.0.1:${WP_PORT:-8080}:80"
    volumes:
      - wp_core:/var/www/html
      - ../frontend/luton-homes:/var/www/html/wp-content/themes/luton-homes
      - ../backend/luton-homes-core:/var/www/html/wp-content/plugins/luton-homes-core

  wpcli:
    image: wordpress:cli-2.12.0-php8.3
    # match www-data in the Debian wordpress image so uploads are writable
    user: "33:33"
    profiles: ["tools"]
    depends_on:
      - db
    environment: *wp-db-env
    volumes:
      - wp_core:/var/www/html
      - ../frontend/luton-homes:/var/www/html/wp-content/themes/luton-homes
      - ../backend/luton-homes-core:/var/www/html/wp-content/plugins/luton-homes-core

volumes:
  db_data:
  wp_core:
