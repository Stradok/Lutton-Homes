{{> head}}
{{> preview-strip}}
{{> header}}
<main id="content">
<section class="page-band">
<div class="wrap">
<h1>Our homes</h1>
<p class="intro">Five short-stay homes near Luton Airport. Each has its own name, rules and sample rate.</p>
</div>
</section>
<section class="homes-main">
<div class="wrap">
<div id="stay-summary" class="stay-summary" hidden>
<p id="stay-text"></p>
<a class="link" href="/homes/">Change dates</a>
</div>
<div class="filters" role="group" aria-label="Filter homes">
<button type="button" class="chip" data-tag="all" aria-pressed="true" aria-controls="home-list">All</button>
<button type="button" class="chip" data-tag="studio" aria-pressed="false" aria-controls="home-list">Studios</button>
<button type="button" class="chip" data-tag="one bedroom" aria-pressed="false" aria-controls="home-list">One bedroom</button>
<button type="button" class="chip" data-tag="two bedrooms" aria-pressed="false" aria-controls="home-list">Two bedrooms</button>
<button type="button" class="chip" data-tag="garden" aria-pressed="false" aria-controls="home-list">Garden</button>
<p class="filter-count" id="filter-count" role="status">{{count}}</p>
</div>
<ul class="home-cards" id="home-list">{{{homeCards}}}</ul>
</div>
</section>
</main>
{{> footer}}
<script src="/assets/homes.js" defer></script>
</body>
</html>
